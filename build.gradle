plugins {
    id 'java'
    id 'application'
}

group = 'dev.qilinfd'
version = '0.0.1-SNAPSHOT'

ext {
    compatibleFlowDroidVersion = '2.15.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.qilinfd.bridge.BridgeMain'
}

def qilinJarPath = providers.gradleProperty('qilinJar')
        .orElse(layout.projectDirectory.file('lib/qilin/Qilin-0.9.8-SNAPSHOT.jar').asFile.absolutePath)

configurations {
    standaloneFlowDroid
    owaspBenchmarkCompile
    vulnerableAppCompile
}

dependencies {
    // Qilin supplies its PTA API and the classic Soot model used by that PTA.
    implementation files(qilinJarPath)

    // FlowDroid remains an independent component. Qilin's bundled Soot satisfies its Soot API references.
    implementation("de.fraunhofer.sit.sse.flowdroid:soot-infoflow:${compatibleFlowDroidVersion}") {
        transitive = false
    }
    implementation 'net.sf.trove4j:core:3.1.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    // Optional local copy for inspecting the exact FlowDroid binary used by this project.
    standaloneFlowDroid("de.fraunhofer.sit.sse.flowdroid:soot-infoflow:${compatibleFlowDroidVersion}") {
        transitive = false
    }

    owaspBenchmarkCompile 'javax.servlet:javax.servlet-api:3.1.0'

    vulnerableAppCompile 'org.springframework:spring-context:5.3.31'
    vulnerableAppCompile 'org.springframework:spring-web:5.3.31'
    vulnerableAppCompile 'org.apache.commons:commons-lang3:3.12.0'
    vulnerableAppCompile 'com.fasterxml.jackson.core:jackson-annotations:2.13.5'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.register('stageFlowDroidJar', Sync) {
    description = 'Copies the independent FlowDroid JAR used by the bridge into lib/flowdroid for inspection.'
    group = 'setup'
    outputs.upToDateWhen { false }
    doFirst {
        delete fileTree(layout.projectDirectory.dir('lib/flowdroid')) {
            include 'soot-infoflow-*.jar'
        }
    }
    from configurations.standaloneFlowDroid
    into layout.projectDirectory.dir('lib/flowdroid')
    preserve {
        include '.gitkeep'
    }
}

tasks.register('compileSmoke', JavaCompile) {
    description = 'Compiles the plain-Java smoke target that is analyzed by FlowDroid.'
    group = 'verification'
    source = fileTree('benchmarks/smoke/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('smoke/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('smokeJar', Jar) {
    description = 'Packages the smoke target for static analysis.'
    group = 'verification'
    dependsOn tasks.named('compileSmoke')
    archiveFileName = 'qilinfd-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from tasks.named('compileSmoke').map { it.destinationDirectory }
}

tasks.register('compileSecuriBench', JavaCompile) {
    description = 'Compiles the checked-out SecuriBench Micro corpus and a Java entry-point harness.'
    group = 'verification'
    source = files(
            fileTree('benchmarks/securibench-micro/src') { include '**/*.java' },
            fileTree('benchmarks/securibench-harness/src') { include '**/*.java' })
    classpath = files(fileTree('benchmarks/securibench-micro/lib') { include '*.jar' })
    destinationDirectory = layout.buildDirectory.dir('securibench/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('securiBenchJar', Jar) {
    description = 'Packages SecuriBench Micro with its analysis-only harness.'
    group = 'verification'
    dependsOn tasks.named('compileSecuriBench')
    archiveFileName = 'securibench-micro-harness.jar'
    destinationDirectory = layout.buildDirectory.dir('securibench')
    from tasks.named('compileSecuriBench').map { it.destinationDirectory }
}

tasks.register('compileFlowDroidOfficialConstantSelected', JavaCompile) {
    description = 'Compiles FlowDroid official ConstantTestCode.easyConstantVarTest and a Java entry-point harness.'
    group = 'verification'
    source = files(
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/ConstantTestCode.java',
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/android/ConnectionManager.java',
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/android/TelephonyManager.java',
            'benchmarks/harness/flowdroid-official/src/dev/qilinfd/bench/flowdroid/ConstantTestHarness.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('flowdroid-official/constant/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('flowDroidOfficialConstantSelectedJar', Jar) {
    description = 'Packages the selected FlowDroid official positive test for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileFlowDroidOfficialConstantSelected')
    archiveFileName = 'flowdroid-official-constant-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('flowdroid-official/constant')
    from tasks.named('compileFlowDroidOfficialConstantSelected').map { it.destinationDirectory }
}

tasks.register('compileOwaspBenchmarkSelected', JavaCompile) {
    description = 'Compiles the confirmed-positive OWASP Benchmark XSS route and its analysis harness.'
    group = 'verification'
    source = files(
            'benchmarks/github/benchmark-java/src/main/java/org/owasp/benchmark/testcode/BenchmarkTest00380.java',
            'benchmarks/harness/github/owasp-benchmark/src/org/owasp/benchmark/testcode/BenchmarkTest00380Harness.java')
    classpath = configurations.owaspBenchmarkCompile
    destinationDirectory = layout.buildDirectory.dir('github/owasp-benchmark/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('stageOwaspBenchmarkLibraries', Copy) {
    description = 'Stages Servlet API classes required while analyzing the selected OWASP endpoint.'
    group = 'setup'
    from configurations.owaspBenchmarkCompile
    into layout.buildDirectory.dir('github/owasp-benchmark/lib')
}

tasks.register('owaspBenchmarkSelectedJar', Jar) {
    description = 'Packages the selected OWASP Benchmark XSS endpoint for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileOwaspBenchmarkSelected')
    archiveFileName = 'owasp-benchmark-xss-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('github/owasp-benchmark')
    from tasks.named('compileOwaspBenchmarkSelected').map { it.destinationDirectory }
}

tasks.register('compileJulietSelected', JavaCompile) {
    description = 'Compiles the Juliet CWE-78 environment-to-command baseline and its explicit entry harness.'
    group = 'verification'
    source = files(
            'benchmarks/github/juliet-test-suite/src/testcases/CWE78_OS_Command_Injection/CWE78_OS_Command_Injection__Environment_01.java',
            'benchmarks/github/juliet-test-suite/src/testcasesupport/AbstractTestCaseBase.java',
            'benchmarks/github/juliet-test-suite/src/testcasesupport/AbstractTestCase.java',
            'benchmarks/github/juliet-test-suite/src/testcasesupport/IO.java',
            'benchmarks/harness/github/juliet/src/testcases/CWE78_OS_Command_Injection/CWE78EnvironmentHarness.java')
    classpath = files('benchmarks/github/juliet-test-suite/lib/servlet-api.jar')
    destinationDirectory = layout.buildDirectory.dir('github/juliet/classes')
    options.release = 8
    options.encoding = 'UTF-8'
