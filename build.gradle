tasks.register('vulnerableAppSelectedJar', Jar) {
    description = 'Packages the selected VulnerableApp command-injection endpoint for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileVulnerableAppSelected')
    archiveFileName = 'vulnerable-app-command-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('github/vulnerable-app')
    from tasks.named('compileVulnerableAppSelected').map { it.destinationDirectory }
}

tasks.register('stageVulnerableAppLibraries', Copy) {
    description = 'Stages the libraries needed while analyzing the selected VulnerableApp endpoint.'
    group = 'setup'
    from configurations.vulnerableAppCompile
    into layout.buildDirectory.dir('github/vulnerable-app/lib')
}

def configureAnalysisRun = { JavaExec task, String backend ->
    task.dependsOn tasks.named('classes'), tasks.named('smokeJar')
    task.classpath = sourceSets.main.runtimeClasspath
    task.mainClass = application.mainClass
    task.maxHeapSize = '4g'
    task.workingDir = projectDir
    task.args = ['run', '--config', file("benchmarks/config/smoke-${backend}.properties").absolutePath]
}

tasks.register('runSmokeQilin', JavaExec) {
    description = 'Analyzes the smoke target with Qilin call graph and points-to results.'
    group = 'verification'
    configureAnalysisRun(delegate, 'qilin')
}

tasks.register('runSmokeNative', JavaExec) {
    description = 'Analyzes the smoke target with FlowDroid/Soot native SPARK configuration.'
    group = 'verification'
    configureAnalysisRun(delegate, 'native')
}

tasks.register('verifySmokeQilin') {
    description = 'Runs the Qilin-backed smoke analysis and checks that a leak is reported.'
    group = 'verification'
    dependsOn tasks.named('runSmokeQilin')
    doLast {
        File result = file('results/smoke-qilin.txt')
        if (!result.text.contains('flowDroidLeaks=1')) {
            throw new GradleException("Expected one Qilin-backed FlowDroid leak in ${result}.")
        }
    }
}

tasks.register('verifySmokeNative') {
    description = 'Runs native FlowDroid smoke analysis and checks that a leak is reported.'
    group = 'verification'
    dependsOn tasks.named('runSmokeNative')
    doLast {
        File result = file('results/smoke-native.txt')
        if (!result.text.contains('flowDroidLeaks=1')) {
            throw new GradleException("Expected one native FlowDroid leak in ${result}.")
        }
    }
}

tasks.register('runSecuriBenchBasic1Qilin', JavaExec) {
    description = 'Runs Qilin-backed FlowDroid over the SecuriBench Micro Basic1 expected-positive case.'
    group = 'verification'
    dependsOn tasks.named('classes'), tasks.named('securiBenchJar')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    maxHeapSize = '4g'
    workingDir = projectDir
    args = ['run', '--config', file('benchmarks/config/securibench-basic1-qilin.properties').absolutePath]
}

tasks.register('verifySecuriBenchBasic1Qilin') {
    description = 'Checks Qilin-backed FlowDroid against the known-positive SecuriBench Micro Basic1 case.'
    group = 'verification'
    dependsOn tasks.named('runSecuriBenchBasic1Qilin')
    doLast {
        File result = file('results/securibench-basic1-qilin.txt')
        if (!result.text.contains('flowDroidLeaks=1')) {
            throw new GradleException("Expected one Qilin-backed FlowDroid leak in ${result}.")
        }
    }
}

tasks.register('runFlowDroidOfficialConstantQilin', JavaExec) {
    description = 'Runs Qilin-backed FlowDroid over the official ConstantTestCode.easyConstantVarTest positive case.'
    group = 'verification'
    dependsOn tasks.named('classes'), tasks.named('flowDroidOfficialConstantSelectedJar')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    maxHeapSize = '4g'
    workingDir = projectDir
    args = ['run', '--config', file('benchmarks/config/flowdroid-official-constant-qilin.properties').absolutePath]
}

tasks.register('verifyFlowDroidOfficialConstantQilin') {
    description = 'Checks Qilin-backed FlowDroid against its official expected-positive constant-variable case.'
    group = 'verification'
    dependsOn tasks.named('runFlowDroidOfficialConstantQilin')
    doLast {
        File result = file('results/flowdroid-official-constant-qilin.txt')
        if (!result.text.contains('flowDroidLeaks=1')) {
            throw new GradleException("Expected one Qilin-backed FlowDroid leak in ${result}.")
        }
    }
}

def registerGithubQilinRun = { String taskName, String descriptionText, String jarTaskName,
                               String configName ->
    tasks.register(taskName, JavaExec) {
        description = descriptionText
        group = 'verification'
        dependsOn tasks.named('classes'), tasks.named(jarTaskName)
        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        maxHeapSize = '4g'
        workingDir = projectDir
        args = ['run', '--config', file("benchmarks/config/${configName}").absolutePath]
    }
}

registerGithubQilinRun(
        'runOwaspBenchmarkQilin',
        'Analyzes an OWASP Benchmark confirmed XSS endpoint with Qilin-backed FlowDroid.',
        'owaspBenchmarkSelectedJar',
        'github-owasp-benchmark-xss.properties')
tasks.named('runOwaspBenchmarkQilin') {
    dependsOn tasks.named('stageOwaspBenchmarkLibraries')
}

registerGithubQilinRun(
        'runJulietQilin',
        'Analyzes a Juliet CWE-78 confirmed bad flow with Qilin-backed FlowDroid.',
        'julietSelectedJar',
        'github-juliet-cwe78.properties')

registerGithubQilinRun(
        'runVulnerableAppQilin',
        'Analyzes the VulnerableApp command-injection endpoint with Qilin-backed FlowDroid.',
        'vulnerableAppSelectedJar',
        'github-vulnerable-app-command.properties')
tasks.named('runVulnerableAppQilin') {
    dependsOn tasks.named('stageVulnerableAppLibraries')
}

tasks.register('runGithubCorpusQilin') {
    description = 'Runs all selected GitHub-project taint analyses through Qilin-backed FlowDroid.'
    group = 'verification'
    dependsOn tasks.named('runOwaspBenchmarkQilin'), tasks.named('runJulietQilin'), tasks.named('runVulnerableAppQilin')
}

def registerGithubLeakVerification = { String taskName, String descriptionText, String runTaskName,
                                       String resultName, int expectedLeaks ->
    tasks.register(taskName) {
        description = descriptionText
        group = 'verification'
        dependsOn tasks.named(runTaskName)
        doLast {
            File result = file("results/${resultName}")
            String expected = "flowDroidLeaks=${expectedLeaks}"
            if (!result.text.contains(expected)) {
                throw new GradleException("Expected ${expected} in ${result}.")
            }
        }
    }
}

registerGithubLeakVerification(
        'verifyOwaspBenchmarkQilin',
        'Checks the selected OWASP Benchmark confirmed XSS endpoint for one Qilin-backed leak.',
        'runOwaspBenchmarkQilin',
        'github-owasp-benchmark-xss.txt',
        1)

registerGithubLeakVerification(
        'verifyJulietQilin',
        'Checks the selected Juliet CWE-78 bad flow for one Qilin-backed leak.',
        'runJulietQilin',
        'github-juliet-cwe78.txt',
        1)

registerGithubLeakVerification(
        'verifyVulnerableAppQilin',
        'Checks the selected VulnerableApp command route for its two OS-specific Qilin-backed leaks.',
        'runVulnerableAppQilin',
        'github-vulnerable-app-command.txt',
        2)

tasks.register('verifyGithubCorpusQilin') {
    description = 'Runs and verifies all selected GitHub-project Qilin-backed taint analyses.'
    group = 'verification'
    dependsOn tasks.named('verifyOwaspBenchmarkQilin'), tasks.named('verifyJulietQilin'),
            tasks.named('verifyVulnerableAppQilin')
}

tasks.register('verifyGuidedExperimentsQilin') {
    description = 'Runs the three step-by-step tutorial experiments: smoke, FlowDroid official, and Juliet.'
    group = 'verification'
    dependsOn tasks.named('verifySmokeQilin'), tasks.named('verifyFlowDroidOfficialConstantQilin'),
            tasks.named('verifyJulietQilin')
}
