plugins {
    id 'java'
    id 'application'
}

group = 'dev.qilinfd'
version = '0.0.1-SNAPSHOT'

ext {
    compatibleFlowDroidVersion = '2.14.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.qilinfd.bridge.BridgeMain'
}

tasks.register('portableJar', Jar) {
    description = 'Builds the thin, Linux-portable qlin-FD bridge JAR.'
    group = 'distribution'
    dependsOn tasks.named('classes')
    archiveFileName = 'qilin-FD.jar'
    destinationDirectory = layout.buildDirectory.dir('portable')
    from sourceSets.main.output
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Class-Path': 'lib/qilin/Qilin-0.10.10.3-SNAPSHOT.jar '
                        + 'lib/flowdroid/soot-infoflow-2.14.1.jar'
        )
    }
}

def qilinJarPath = providers.gradleProperty('qilinJar')
        .orElse(layout.projectDirectory.file('lib/qilin/Qilin-0.10.10.3-SNAPSHOT.jar').asFile.absolutePath)

configurations {
    standaloneFlowDroid
    owaspBenchmarkCompile
    owaspBenchmarkFullCompile
    vulnerableAppCompile
}

dependencies {
    // Qilin supplies its PTA API and the classic Soot model used by that PTA.
    implementation files(qilinJarPath)

    // FlowDroid remains an independent component. Qilin's bundled Soot satisfies its Soot API references.
    implementation("de.fraunhofer.sit.sse.flowdroid:soot-infoflow:${compatibleFlowDroidVersion}") {
        transitive = false
    }
    implementation 'net.sf.trove4j:core:3.1.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    // Optional local copy for inspecting the exact FlowDroid binary used by this project.
    standaloneFlowDroid("de.fraunhofer.sit.sse.flowdroid:soot-infoflow:${compatibleFlowDroidVersion}") {
        transitive = false
    }

    owaspBenchmarkCompile 'javax.servlet:javax.servlet-api:3.1.0'

    // Matches the direct compile/runtime dependencies of OWASP Benchmark Java v1.2.
    owaspBenchmarkFullCompile 'javax:javaee-api:8.0.1'
    owaspBenchmarkFullCompile 'javax.xml.bind:jaxb-api:2.3.1'
    owaspBenchmarkFullCompile 'com.sun.xml.bind:jaxb-impl:2.3.9'
    owaspBenchmarkFullCompile 'com.sun.jersey:jersey-servlet:1.19.4'
    owaspBenchmarkFullCompile 'commons-codec:commons-codec:1.22.0'
    owaspBenchmarkFullCompile 'commons-dbcp:commons-dbcp:1.4'
    owaspBenchmarkFullCompile 'commons-io:commons-io:2.22.0'
    owaspBenchmarkFullCompile 'commons-lang:commons-lang:2.6'
    owaspBenchmarkFullCompile 'org.slf4j:slf4j-reload4j:2.0.18'
    owaspBenchmarkFullCompile 'org.apache.directory.api:api-ldap-model:2.1.7'
    owaspBenchmarkFullCompile 'org.apache.directory.api:api-ldap-schema-data:2.1.7'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core-annotations:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core-api:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core-avl:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core-constants:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-core-jndi:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-interceptor-kerberos:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-jdbm-partition:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-kerberos-codec:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-ldif-partition:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-protocol-ldap:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-protocol-shared:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-server-annotations:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-server-jndi:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-test-framework:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.directory.server:apacheds-xdbm-partition:2.0.0.AM27'
    owaspBenchmarkFullCompile 'org.apache.httpcomponents.client5:httpclient5:5.6.1'
    owaspBenchmarkFullCompile 'org.apache.httpcomponents.core5:httpcore5:5.4.2'
    owaspBenchmarkFullCompile 'org.bouncycastle:bcprov-jdk15on:1.70'
    owaspBenchmarkFullCompile 'org.hibernate:hibernate-core:3.6.10.Final'
    owaspBenchmarkFullCompile 'org.hibernate:hibernate-entitymanager:3.6.10.Final'
    owaspBenchmarkFullCompile 'org.hsqldb:hsqldb:2.7.4'
    owaspBenchmarkFullCompile 'org.owasp.esapi:esapi:2.7.0.0'
    owaspBenchmarkFullCompile 'org.springframework:spring-context:5.3.39'
    owaspBenchmarkFullCompile 'org.springframework:spring-jdbc:5.3.39'
    owaspBenchmarkFullCompile 'org.springframework:spring-tx:5.3.39'
    owaspBenchmarkFullCompile 'org.springframework:spring-web:5.3.39'
    owaspBenchmarkFullCompile 'org.springframework:spring-webmvc:5.3.39'
    owaspBenchmarkFullCompile 'xml-apis:xml-apis:1.4.01'
    owaspBenchmarkFullCompile 'com.fasterxml.jackson.core:jackson-databind:2.21.3'

    vulnerableAppCompile 'org.springframework:spring-context:5.3.31'
    vulnerableAppCompile 'org.springframework:spring-web:5.3.31'
    vulnerableAppCompile 'org.apache.commons:commons-lang3:3.12.0'
    vulnerableAppCompile 'com.fasterxml.jackson.core:jackson-annotations:2.13.5'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.register('stageFlowDroidJar', Sync) {
    description = 'Copies the independent FlowDroid JAR used by the bridge into lib/flowdroid for inspection.'
    group = 'setup'
    outputs.upToDateWhen { false }
    doFirst {
        delete fileTree(layout.projectDirectory.dir('lib/flowdroid')) {
            include 'soot-infoflow-*.jar'
        }
    }
    from configurations.standaloneFlowDroid
    into layout.projectDirectory.dir('lib/flowdroid')
    preserve {
        include '.gitkeep'
    }
}

tasks.register('stageBridgeRuntimeLibraries', Sync) {
    description = 'Stages the bridge runtime dependencies for direct, repeatable Java execution.'
    group = 'setup'
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('bridge-runtime/lib')
}

tasks.register('compileSmoke', JavaCompile) {
    description = 'Compiles the plain-Java smoke target that is analyzed by FlowDroid.'
    group = 'verification'
    source = fileTree('benchmarks/smoke/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('smoke/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('smokeJar', Jar) {
    description = 'Packages the smoke target for static analysis.'
    group = 'verification'
    dependsOn tasks.named('compileSmoke')
    archiveFileName = 'qilinfd-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from tasks.named('compileSmoke').map { it.destinationDirectory }
}

tasks.register('compileSecuriBench', JavaCompile) {
    description = 'Compiles the checked-out SecuriBench Micro corpus and a Java entry-point harness.'
    group = 'verification'
    source = files(
            fileTree('benchmarks/securibench-micro/src') { include '**/*.java' },
            fileTree('benchmarks/securibench-harness/src') { include '**/*.java' })
    classpath = files(fileTree('benchmarks/securibench-micro/lib') { include '*.jar' })
    destinationDirectory = layout.buildDirectory.dir('securibench/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('securiBenchJar', Jar) {
    description = 'Packages SecuriBench Micro with its analysis-only harness.'
    group = 'verification'
    dependsOn tasks.named('compileSecuriBench')
    archiveFileName = 'securibench-micro-harness.jar'
    destinationDirectory = layout.buildDirectory.dir('securibench')
    from tasks.named('compileSecuriBench').map { it.destinationDirectory }
}

tasks.register('compileFlowDroidOfficialConstantSelected', JavaCompile) {
    description = 'Compiles FlowDroid official ConstantTestCode.easyConstantVarTest and a Java entry-point harness.'
    group = 'verification'
    source = files(
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/ConstantTestCode.java',
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/android/ConnectionManager.java',
            'benchmarks/flowdroid-official/soot-infoflow/test/soot/jimple/infoflow/test/android/TelephonyManager.java',
            'benchmarks/harness/flowdroid-official/src/dev/qilinfd/bench/flowdroid/ConstantTestHarness.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('flowdroid-official/constant/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('flowDroidOfficialConstantSelectedJar', Jar) {
    description = 'Packages the selected FlowDroid official positive test for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileFlowDroidOfficialConstantSelected')
    archiveFileName = 'flowdroid-official-constant-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('flowdroid-official/constant')
    from tasks.named('compileFlowDroidOfficialConstantSelected').map { it.destinationDirectory }
}

tasks.register('compileOwaspBenchmarkSelected', JavaCompile) {
    description = 'Compiles the confirmed-positive OWASP Benchmark XSS route and its analysis harness.'
    group = 'verification'
    source = files(
            'benchmarks/github/benchmark-java/src/main/java/org/owasp/benchmark/testcode/BenchmarkTest00380.java',
            'benchmarks/harness/github/owasp-benchmark/src/org/owasp/benchmark/testcode/BenchmarkTest00380Harness.java')
    classpath = configurations.owaspBenchmarkCompile
    destinationDirectory = layout.buildDirectory.dir('github/owasp-benchmark/classes')
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('stageOwaspBenchmarkLibraries', Copy) {
    description = 'Stages Servlet API classes required while analyzing the selected OWASP endpoint.'
    group = 'setup'
    from configurations.owaspBenchmarkCompile
    into layout.buildDirectory.dir('github/owasp-benchmark/lib')
}

tasks.register('owaspBenchmarkSelectedJar', Jar) {
    description = 'Packages the selected OWASP Benchmark XSS endpoint for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileOwaspBenchmarkSelected')
    archiveFileName = 'owasp-benchmark-xss-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('github/owasp-benchmark')
    from tasks.named('compileOwaspBenchmarkSelected').map { it.destinationDirectory }
}

tasks.register('compileOwaspBenchmarkFull', JavaCompile) {
    description = 'Compiles OWASP Benchmark Java v1.2 and generated category harnesses.'
    group = 'verification'
    source = files(
            fileTree('owasp-benchmark-java/src/main/java') { include '**/*.java' },
            fileTree('benchmarks/harness/owasp-focused/src') { include '**/*.java' },
            fileTree(layout.buildDirectory.dir('generated/owasp-benchmark/src')) { include '**/*.java' })
    classpath = configurations.owaspBenchmarkFullCompile
    destinationDirectory = layout.buildDirectory.dir('owasp-benchmark/classes')
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-options']
    doFirst {
        File generatedRoot = layout.buildDirectory.dir('generated/owasp-benchmark/src').get().asFile
        if (!generatedRoot.exists() || fileTree(generatedRoot).matching { include '**/*.java' }.isEmpty()) {
            throw new GradleException('Generate OWASP category harnesses with scripts/run_owasp_fspec.py first.')
        }
    }
}

tasks.register('owaspBenchmarkFullJar', Jar) {
    description = 'Packages the complete OWASP Benchmark Java corpus and category harnesses.'
    group = 'verification'
    dependsOn tasks.named('compileOwaspBenchmarkFull')
    archiveFileName = 'owasp-benchmark-java-v1.2-analysis.jar'
    destinationDirectory = layout.buildDirectory.dir('owasp-benchmark')
    from tasks.named('compileOwaspBenchmarkFull').map { it.destinationDirectory }
}

tasks.register('stageOwaspBenchmarkFullLibraries', Sync) {
    description = 'Stages the OWASP Benchmark Java dependency jars for whole-program analysis.'
    group = 'setup'
    from configurations.owaspBenchmarkFullCompile
    into layout.buildDirectory.dir('owasp-benchmark/lib')
}

tasks.named('run', JavaExec) {
    maxHeapSize = providers.gradleProperty('analysisHeap').orElse('16g').get()
}

def registerFocusedOwaspRun = { String taskName, String configName ->
    tasks.register(taskName, JavaExec) {
        description = "Runs the focused OWASP XPath regression (${configName})."
        group = 'verification'
        dependsOn tasks.named('classes'), tasks.named('owaspBenchmarkFullJar'),
                tasks.named('stageOwaspBenchmarkFullLibraries')
        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        maxHeapSize = '16g'
        workingDir = projectDir
        args = ['run', '--config',
                file("benchmarks/config/owasp-xpath-00442-${configName}.properties").absolutePath]
    }
}

registerFocusedOwaspRun('runOwaspXpathFocusedBaseline', 'baseline')
registerFocusedOwaspRun('runOwaspXpathFocusedFspec', 'fspec')

tasks.register('verifyOwaspXpathFocusedPair') {
    description = 'Checks that baseline and FSpec both preserve OWASP XPath test 00442.'
    group = 'verification'
    dependsOn tasks.named('runOwaspXpathFocusedBaseline'),
            tasks.named('runOwaspXpathFocusedFspec')
    doLast {
        for (String mode : ['baseline', 'fspec']) {
            File result = file("results/owasp/focused/xpathi-00442-1o-${mode}.txt")
            if (!result.text.contains('projectedFlowDroidLeaks=1')) {
                throw new GradleException(
                        "Expected one ${mode} OWASP XPath leak in ${result}.")
            }
        }
    }
}

