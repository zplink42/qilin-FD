tasks.register('julietSelectedJar', Jar) {
    description = 'Packages the selected Juliet CWE-78 test for Qilin analysis.'
    group = 'verification'
    dependsOn tasks.named('compileJulietSelected')
    archiveFileName = 'juliet-cwe78-environment-selected.jar'
    destinationDirectory = layout.buildDirectory.dir('github/juliet')
    from tasks.named('compileJulietSelected').map { it.destinationDirectory }
}

tasks.register('compileVulnerableAppSelected', JavaCompile) {
    description = 'Compiles the VulnerableApp command-injection route with a standalone input harness.'
    group = 'verification'
    source = files(
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/service/vulnerability/commandInjection/CommandInjection.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/service/vulnerability/bean/GenericVulnerabilityResponseBean.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/service/exception/ServiceApplicationException.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/service/exception/ExceptionStatusCodeEnum.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/LevelConstants.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/MessageBundle.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/Variant.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/annotations/AttackVector.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/annotations/VulnerableAppRequestMapping.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/internal/utility/annotations/VulnerableAppRestController.java',
            'benchmarks/github/vulnerable-app/src/main/java/org/sasanlabs/vulnerability/types/VulnerabilityType.java',
            'benchmarks/harness/github/vulnerable-app/src/org/sasanlabs/analysis/CommandInjectionHarness.java')
