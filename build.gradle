def registerGithubQilinRun = { String taskName, String descriptionText, String jarTaskName,
                               String configName ->
    tasks.register(taskName, JavaExec) {
        description = descriptionText
        group = 'verification'
        dependsOn tasks.named('classes'), tasks.named(jarTaskName)
        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        maxHeapSize = '4g'
        workingDir = projectDir
        args = ['run', '--config', file("benchmarks/config/${configName}").absolutePath]
    }
}

registerGithubQilinRun(
        'runOwaspBenchmarkQilin',
        'Analyzes an OWASP Benchmark confirmed XSS endpoint with Qilin-backed FlowDroid.',
        'owaspBenchmarkSelectedJar',
        'github-owasp-benchmark-xss.properties')
tasks.named('runOwaspBenchmarkQilin') {
    dependsOn tasks.named('stageOwaspBenchmarkLibraries')
}

registerGithubQilinRun(
        'runJulietQilin',
