def configureAnalysisRun = { JavaExec task, String backend ->
    task.dependsOn tasks.named('classes'), tasks.named('smokeJar')
    task.classpath = sourceSets.main.runtimeClasspath
    task.mainClass = application.mainClass
    task.maxHeapSize = '4g'
    task.workingDir = projectDir
    task.args = ['run', '--config', file("benchmarks/config/smoke-${backend}.properties").absolutePath]
}

tasks.register('runSmokeQilin', JavaExec) {
    description = 'Analyzes the smoke target with Qilin call graph and points-to results.'
    group = 'verification'
    configureAnalysisRun(delegate, 'qilin')
}

tasks.register('runSmokeFspec', JavaExec) {
    description = 'Analyzes the smoke target with Qilin FSpec call graph and points-to results.'
    group = 'verification'
    dependsOn tasks.named('classes'), tasks.named('smokeJar')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    maxHeapSize = '4g'
    workingDir = projectDir
    args = ['run', '--config', file('benchmarks/config/smoke-fspec.properties').absolutePath]
}

tasks.register('runSmokeNative', JavaExec) {
    description = 'Analyzes the smoke target with FlowDroid/Soot native SPARK configuration.'
    group = 'verification'
    configureAnalysisRun(delegate, 'native')
}

tasks.register('verifySmokeQilin') {
    description = 'Runs the Qilin-backed smoke analysis and checks that a leak is reported.'
    group = 'verification'
    dependsOn tasks.named('runSmokeQilin')
    doLast {
        File result = file('results/smoke-qilin.txt')
        if (!result.text.contains('projectedFlowDroidLeaks=1')) {
            throw new GradleException("Expected one Qilin-backed FlowDroid leak in ${result}.")
        }
    }
}

tasks.register('verifySmokeFspec') {
    description = 'Runs the FSpec-backed smoke analysis and checks that the known leak is preserved.'
    group = 'verification'
    dependsOn tasks.named('runSmokeFspec')
    doLast {
        File result = file('results/smoke-fspec.txt')
        if (!result.text.contains('projectedFlowDroidLeaks=1')) {
            throw new GradleException("Expected one FSpec-backed FlowDroid leak in ${result}.")
        }
    }
}

